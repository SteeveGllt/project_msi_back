---
- name: Sets the root password
  mysql_user:
    name: root
    password: "{{ db_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  ignore_errors: true

- name: Removes all anonymous user accounts
  mysql_user:
    name: ''
    host_all: yes
    state: absent
    login_user: root
    login_password: "{{ db_password }}"

- name: Removes the MySQL test database
  mysql_db:
    name: test
    state: absent
    login_user: root
    login_password: "{{ db_password }}"

